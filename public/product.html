<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product — Pulse</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site">
  <div class="site-row">
    <a class="brand" href="index.html">
      <span class="mark"><svg viewBox="0 0 24 24" fill="none"><polyline points="2,13 7,13 9,7 13,19 15,13 22,13" stroke="var(--accent)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      Pulse
    </a>
    <nav class="links">
      <a href="index.html">Home</a>
      <a href="shop.html">Shop</a>
      <a href="shop.html?category=Running">Running</a>
      <a href="shop.html?category=Training">Training</a>
      <a href="admin.html">Admin</a>
    </nav>
    <div class="header-actions">
      <a class="cart-link" href="cart.html">Cart <span class="cart-count" data-cart-count>0</span></a>
    </div>
  </div>
</header>

<main>
  <div class="wrap" id="detailContainer">
    <p style="color:var(--ink-dim);padding:40px 0;">Loading…</p>
  </div>
</main>

<footer class="site-footer">
  Full-stack demo store — Node.js + Express + SQLite backend, plain HTML/CSS/JS frontend.
</footer>

<script src="cart.js"></script>
<script>
(function () {
  var id = new URLSearchParams(location.search).get('id');
  var container = document.getElementById('detailContainer');
  var qty = 1;
  var selectedSize = null;
  var SIZES = ['7', '8', '9', '10', '11', '12', '13'];

  function render(p) {
    container.innerHTML =
      '<div class="detail-grid">' +
        '<div class="detail-visual" style="' + mediaBg(p.accent) + '">' + shoeSvg(p.accent) + '</div>' +
        '<div class="detail-body">' +
          '<div class="cat">' + p.category + '</div>' +
          '<h1 class="display">' + p.name + '</h1>' +
          '<div class="price">' + money(p.price_cents) + '</div>' +
          '<p class="desc">' + p.description + '</p>' +
          '<div class="size-row">' +
            '<span class="label">Select size (US)</span>' +
            '<div class="size-grid" id="sizeGrid">' +
              SIZES.map(function (s) { return '<button type="button" class="size-pill" data-size="' + s + '">' + s + '</button>'; }).join('') +
            '</div>' +
          '</div>' +
          '<div class="qty-row">' +
            '<div class="qty-control">' +
              '<button type="button" id="qtyDown" aria-label="Decrease quantity">−</button>' +
              '<span id="qtyVal">1</span>' +
              '<button type="button" id="qtyUp" aria-label="Increase quantity">+</button>' +
            '</div>' +
            '<span class="stock-note">' + (p.stock > 0 ? p.stock + ' in stock' : 'Out of stock') + '</span>' +
          '</div>' +
          '<button class="btn btn-primary btn-block" id="addBtn" ' + (p.stock === 0 ? 'disabled' : '') + '>' +
            (p.stock === 0 ? 'Sold out' : 'Add to cart') +
          '</button>' +
          '<div class="msg" id="addMsg"></div>' +
        '</div>' +
      '</div>';

    document.getElementById('sizeGrid').addEventListener('click', function (e) {
      var btn = e.target.closest('.size-pill');
      if (!btn) return;
      selectedSize = btn.dataset.size;
      document.querySelectorAll('.size-pill').forEach(function (b) { b.classList.remove('selected'); });
      btn.classList.add('selected');
    });

    document.getElementById('qtyDown').addEventListener('click', function () { qty = Math.max(1, qty - 1); document.getElementById('qtyVal').textContent = qty; });
    document.getElementById('qtyUp').addEventListener('click', function () { qty = Math.min(p.stock, qty + 1); document.getElementById('qtyVal').textContent = qty; });
    document.getElementById('addBtn').addEventListener('click', function () {
      var msg = document.getElementById('addMsg');
      if (!selectedSize) {
        msg.textContent = 'Pick a size first.';
        msg.className = 'msg show err';
        return;
      }
      Cart.add(p.id, qty, selectedSize);
      msg.textContent = qty + '× ' + p.name + ' (size ' + selectedSize + ') added to your cart.';
      msg.className = 'msg show ok';
    });
  }

  if (!id) {
    container.innerHTML = '<div class="empty-state"><div class="display">No product selected</div><a class="btn btn-outline" href="shop.html">Back to shop</a></div>';
  } else {
    fetch('/api/products/' + id)
      .then(function (r) { if (!r.ok) throw new Error(); return r.json(); })
      .then(render)
      .catch(function () {
        container.innerHTML = '<div class="empty-state"><div class="display">Product not found</div><a class="btn btn-outline" href="shop.html">Back to shop</a></div>';
      });
  }
})();
</script>
</body>
</html>
